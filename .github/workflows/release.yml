name: Release

on:
  push:
    branches: [main]

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      new-release-version: ${{ steps.determine_version.outputs.new-release-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "lts/*"

      - name: Install semantic-release
        run: npm ci

      - name: Determine version
        id: determine_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OUTPUT="$(npx semantic-release --dry-run --no-ci)"
          NEW_RELEASE_VERSION=$(echo "$OUTPUT" | grep 'The next release version is' | sed 's/.*is \([0-9.]*\).*/\1/')
          if [ -z "$NEW_RELEASE_VERSION" ]; then
            NEW_RELEASE_VERSION="0.0.0"
            echo "First commit detected, setting initial version to 0.0.0"
          fi
          echo "new-release-version=$NEW_RELEASE_VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: macos-latest
    outputs:
      zip-path: ${{ steps.create_zip.outputs.zip-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Update version
        run: |
          echo "The version is ${{ needs.version.outputs.new-release-version }}"
          PROJECT_FILE="wall-scene.xcodeproj/project.pbxproj"
          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = ${{ needs.version.outputs.new-release-version }};/g" "$PROJECT_FILE"
          echo "Updated Marketing version to ${{ needs.version.outputs.new-release-version }}"
          agvtool next-version -all

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: "latest-stable"

      - name: Build
        run: |
          xcodebuild clean archive \
            -project "wall-scene.xcodeproj" \
            -scheme "wall-scene" \
            -configuration Release \
            -archivePath "wall-scene.xcarchive"

      - name: Create ZIP
        id: create_zip
        run: |
          cd "wall-scene.xcarchive/Products/Applications"
          ditto -c -k --sequesterRsrc --keepParent "wall-scene.app" "../../../wall-scene.app.zip"
          echo "zip-path=$(realpath "../../../wall-scene.app.zip")" >> "$GITHUB_OUTPUT"

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts
          cp "wall-scene.app.zip" artifacts/app.zip
          cp "wall-scene.xcodeproj/project.pbxproj" artifacts/project.pbxproj

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-artifacts
          path: artifacts/

  release:
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: build-artifacts
          path: artifacts/

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "lts/*"

      - name: Install semantic-release
        run: npm ci

      - name: Replace project.pbxproj
        run: |
          cp -f artifacts/project.pbxproj "wall-scene.xcodeproj/project.pbxproj"

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release
